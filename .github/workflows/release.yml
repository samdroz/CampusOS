name: Build and Release CampusOS Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Resolve Application Version & Stamp Metadata
        id: version
        run: |
          $releaseTag = $env:GITHUB_REF_NAME
          $appVersion = if ($releaseTag -and $releaseTag -match '^v?(\d+\.\d+\.\d+.*)$') { $Matches[1] } else {
            (Get-Content "frontend\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          if (-not $appVersion) { $appVersion = "1.0.0" }
          $installerName = "CampusOS_${appVersion}_Setup.exe"
          Write-Host "Resolved release version: $appVersion (Installer: $installerName)" -ForegroundColor Cyan

          # Expose to environment and step outputs
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$installerName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Keep tauri.conf.json synchronized with release version
          $tauriConfPath = "frontend\src-tauri\tauri.conf.json"
          if (Test-Path $tauriConfPath) {
            $tauriJson = Get-Content $tauriConfPath -Raw | ConvertFrom-Json
            $tauriJson.version = $appVersion
            $tauriJson | ConvertTo-Json -Depth 10 | Set-Content $tauriConfPath -Encoding utf8
          }

          # Embed release version into backend application BEFORE backend tests and PyInstaller
          $env:CAMPUSOS_VERSION = $appVersion
          Set-Content -Path "backend\app\version.py" -Value "# Auto-generated during release workflow`r`n__version__ = '$appVersion'" -Encoding utf8
          Write-Host "Stamped backend\app\version.py with __version__ = '$appVersion'" -ForegroundColor Green

      - name: Set up Node.js 22 (pinned >= 22.15.0)
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Diagnostic Node Environment Check
        run: |
          node --version
          npm --version
          node -e "const z = require('node:zlib'); console.log('createZstdDecompress is available:', typeof z.createZstdDecompress === 'function'); if (typeof z.createZstdDecompress !== 'function') { console.error('FATAL: createZstdDecompress missing from node:zlib'); process.exit(1); }"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Automated Tests
        run: |
          $env:PYTHONPATH="."
          pytest backend/tests/ -v

      - name: Package Backend Standalone Executable (PyInstaller)
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\src-tauri\binaries"
          $env:PYTHONPATH="."
          pyinstaller --name campusos-backend --onefile --clean `
            --paths . `
            --collect-all backend `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all pydantic `
            --collect-all sqlalchemy `
            --add-data "frontend/dist;frontend/dist" `
            backend/desktop_entry.py
          Copy-Item "dist\campusos-backend.exe" -Destination "frontend\src-tauri\binaries\campusos-backend-x86_64-pc-windows-msvc.exe" -Force

      - name: Install and Verify NSIS
        run: |
          Write-Host "Installing NSIS via Chocolatey..." -ForegroundColor Cyan
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Chocolatey NSIS installation failed with exit code $LASTEXITCODE."
            exit 1
          }

          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS",
            "$env:LOCALAPPDATA\NSIS\nsis-3.10\Bin"
          )
          $nsisDir = $nsisCandidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $nsisDir = Split-Path $cmd.Source
            }
          }

          if (-not $nsisDir -or -not (Test-Path "$nsisDir\makensis.exe")) {
            Write-Error "FATAL: makensis.exe could not be located after NSIS installation."
            exit 1
          }

          Write-Host "NSIS directory located: $nsisDir" -ForegroundColor Green
          Write-Output "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsisDir;$env:PATH"

          Write-Host "Verifying makensis installation:" -ForegroundColor Cyan
          & makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FATAL: makensis /VERSION verification failed with exit code $LASTEXITCODE."
            exit 1
          }

      - name: Build Native Windows Launcher & Standalone Installer
        run: |
          Write-Host "Compiling native Windows launcher (dist\CampusOS.exe)..." -ForegroundColor Cyan
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32icon:"frontend\src-tauri\icons\icon.ico" /out:"dist\CampusOS.exe" "launcher\Program.cs"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "C# Launcher compilation failed with exit code $LASTEXITCODE."
            exit 1
          }
          if (-not (Test-Path "dist\CampusOS.exe")) {
            Write-Error "FATAL: dist\CampusOS.exe was not created."
            exit 1
          }

          # Target release installer
          $appVersion = if ($env:APP_VERSION) { $env:APP_VERSION } elseif ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+.*)$') { $Matches[1] } else {
            (Get-Content "frontend\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          if (-not $appVersion) { $appVersion = "1.0.0" }
          $installerName = "CampusOS_${appVersion}_Setup.exe"
          Write-Host "Target release installer: $installerName (Version: $appVersion)" -ForegroundColor Cyan

          # Verify makensis availability in current session or standard paths
          $makensisCmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $makensisExe = if ($makensisCmd) { $makensisCmd.Source } else {
            @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $makensisExe -or -not (Test-Path $makensisExe)) {
            Write-Error "FATAL: makensis compiler not found in PATH or standard installation directories."
            exit 1
          }

          # Clean up any stale installer before compiling
          Remove-Item -Path "dist\$installerName" -Force -ErrorAction SilentlyContinue

          Write-Host "Compiling standalone installer ($installerName) with $makensisExe..." -ForegroundColor Cyan
          & $makensisExe "/DPRODUCT_VERSION=$appVersion" "installer\CampusOS.nsi"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis installer compilation failed with exit code $LASTEXITCODE."
            exit 1
          }

          if (-not (Test-Path "dist\$installerName")) {
            Write-Error "FATAL: Expected installer package dist\$installerName was not generated."
            exit 1
          }
          Write-Host "Standalone installer generated: dist\$installerName" -ForegroundColor Green

      - name: Collect Release Artifacts
        id: collect
        run: |
          New-Item -ItemType Directory -Force -Path "release_assets"

          # Determine exact expected installer filename
          $appVersion = if ($env:APP_VERSION) { $env:APP_VERSION } elseif ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+.*)$') { $Matches[1] } else {
            (Get-Content "frontend\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          if (-not $appVersion) { $appVersion = "1.0.0" }
          $expectedInstallerName = "CampusOS_${appVersion}_Setup.exe"
          $expectedInstallerPath = "dist\$expectedInstallerName"

          Write-Host "Verifying exact release artifact: $expectedInstallerPath" -ForegroundColor Cyan

          if (-not (Test-Path $expectedInstallerPath)) {
            Write-Error "FATAL: Expected release installer '$expectedInstallerPath' was not found in dist\. Stale or mismatched installers will not be published."
            exit 1
          }

          $installerItem = Get-Item -Path $expectedInstallerPath
          if ($installerItem.Length -lt 1000000) {
            Write-Error "FATAL: Expected release installer '$expectedInstallerPath' is empty or unexpectedly small ($($installerItem.Length) bytes, minimum 1,000,000 bytes required)."
            exit 1
          }

          Write-Host "Found valid release installer: $($installerItem.FullName) ($($installerItem.Length) bytes)" -ForegroundColor Green
          Copy-Item -Path $installerItem.FullName -Destination "release_assets\$expectedInstallerName" -Force

          # Verify artifact was staged into release_assets
          $staged = Get-Item -Path "release_assets\$expectedInstallerName" -ErrorAction Stop
          if (-not $staged -or $staged.Length -lt 1000000) {
            Write-Error "FATAL: Staged release artifact 'release_assets\$expectedInstallerName' is missing or invalid."
            exit 1
          }

          Write-Host "Staged exact release artifact: $($staged.Name) ($($staged.Length) bytes)" -ForegroundColor Green
          Get-ChildItem release_assets\

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CampusOS-Windows-Installer-${{ github.sha }}
          path: release_assets/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          name: CampusOS Desktop ${{ github.ref_name }}
          body: |
            ## CampusOS Desktop Application (${{ github.ref_name }})

            Welcome to the local-first desktop release of CampusOS!

            ### Highlights
            - **Local-First & Offline Privacy:** All subjects, timetable schedules, assignments, attendance logs, and notes are saved directly on your computer in an offline SQLite database (`%APPDATA%\CampusOS\campusos.db`).
            - **Zero Dependencies Required:** You do NOT need to install Python, Node.js, or external database runtimes to run the application. Everything is self-contained.
            - **First-Launch Onboarding:** Set up your student credentials, subjects, and attendance targets with an interactive onboarding wizard.
            - **Complete Academic Suite:** Integrated student dashboard, course catalog, weekly schedules, deadline tracking, exam countdowns, attendance warning calculators, and local JSON backup/restore.

            ### Installation Instructions (Windows)
            1. Download the Windows installer package below (`CampusOS_*_Setup.exe`).
            2. Run the installer and launch CampusOS from your Start Menu or Desktop shortcut.
            3. Complete the welcome setup wizard on your first run.
          draft: false
          prerelease: false
